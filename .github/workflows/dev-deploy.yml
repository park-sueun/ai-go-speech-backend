name: Deploy to Dev

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Spring Boot Build
      - name: Build with Gradle
        run: ./gradlew build -x test

      # AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.DEV_AWS_REGION }}

      # ECR 로그인 및 이미지 push
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.DEV_ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Copy setup files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          # 전송할 파일 및 폴더 리스트 (쉼표로 구분)
          source: "docker-compose.yml,docker-compose.dev.yml,nginx"
          target: "~/deploy"

      # EC2 접속 및 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          # 사용할 변수 목록을 envs에 명시
          envs: ECR_REGISTRY,ECR_REPOSITORY,AWS_REGION
          script: |
            cd ~/deploy
            
            # ECR 로그인
            aws ecr get-login-password --region ${{ vars.DEV_AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            # .env.dev 파일 생성
            echo "${{ secrets.DEV_ENV_FILE }}" > .env.dev

            # default.conf 생성 (인증서가 있을 때만 HTTPS 설정 적용)
            if [ -d "./certbot/conf/live/${{ vars.DEV_DOMAIN }}" ]; then
              sed "s/DOMAIN_PLACEHOLDER/${{ vars.DEV_DOMAIN }}/g" \
                ./nginx/conf.d/default.conf.template > ./nginx/conf.d/default.conf
            fi
            
            # 현재 구동 중인 컨테이너 확인
            IS_BLUE=$(docker ps | grep app-blue)
            
            if [ -z "$IS_BLUE" ]; then
              # 블루가 없으면 블루를 띄운다
              TARGET_COLOR="blue"
              BEFORE_COLOR="green"
              TARGET_PORT=8081
            else
              # 블루가 있으면 그린을 띄운다
              TARGET_COLOR="green"
              BEFORE_COLOR="blue"
              TARGET_PORT=8082
            fi
            
            echo "$TARGET_COLOR 배포를 시작합니다. (Port: $TARGET_PORT)"
            
            # 새로운 이미지 pull 및 타겟 컨테이너 실행
            docker compose -f docker-compose.dev.yml pull app-$TARGET_COLOR            
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d app-$TARGET_COLOR
            
            # 새로운 컨테이너 헬스 체크
            for i in {1..10}; do
              echo "Health check 진행중... ($i/10)"
            
              if curl -s http://localhost:$TARGET_PORT/health | grep -q "UP"; then
                echo "$TARGET_COLOR 가 성공적으로 실행되었습니다!"
                break
              fi
              if [ $i -eq 10 ]; then
                echo "배포 실패: 헬스 체크 타임아웃"
                exit 1
              fi
              sleep 10
            done
            
            # Nginx 트래픽 전환
            echo "set \$service_url http://app-$TARGET_COLOR:8080;" | sudo tee ./nginx/conf.d/service-url.inc
            
            # Nginx/certbot이 항상 떠있도록 보장한 뒤 reload
            docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up -d nginx certbot
            docker exec nginx-dev nginx -s reload
            
            # 이전 컨테이너 중지
            echo "이전 버전($BEFORE_COLOR) 컨테이너를 중지합니다."
            docker stop app-$BEFORE_COLOR || true
            
            # 사용하지 않는 이미지 정리
            docker image prune -f
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.DEV_ECR_REPOSITORY }}
          AWS_REGION: ${{ vars.DEV_AWS_REGION }}