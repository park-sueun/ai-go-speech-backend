  #      interval: 10s
  #      timeout: 5s
  #      retries: 5

  redis:
    image: redis
    networks:
      - app-network

  selenium:
    image: seleniarm/standalone-chromium:latest
    ports:
      - "4444:4444"
    networks:
      - app-network

volumes:
  dev_db_data:
    driver: local

networks:
  app-network:
    driver: bridge