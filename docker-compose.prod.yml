services:
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/log:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - app-network

  certbot:
    container_name: certbot-prod

  app-blue:
    image: myapp:${IMAGE_TAG}
    container_name: app-blue
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "8081:8080"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    logging: &app-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app-green:
    image: myapp:${IMAGE_TAG}
    container_name: app-green
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "8082:8080"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    logging: *app-logging # 위의 로깅 설정 재사용

  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    env_file:
      - .env.prod
    volumes:
      - prod_db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - app-network

volumes:
  prod_db_data:

networks:
  app-network:
    driver: bridge