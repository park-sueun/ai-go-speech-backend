services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - app-blue
      - app-green
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d

  app-blue:
    image: myapp:latest
    networks:
      - app-network

  app-green:
    image: myapp:latest
    networks:
      - app-network

