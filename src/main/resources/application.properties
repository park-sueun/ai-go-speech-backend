spring.application.name=speech
# App
app.base-url=${BASE_URL}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# DATABASE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:speech}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-min=${JWT_ACCESS_TOKEN_EXP_MIN}
jwt.refresh-expiration-days=${JWT_REFRESH_TOKEN_EXP_DAYS}
jwt.reset-secret=${JWT_RESET_SECRET}
jwt.reset-expiration-min=${JWT_RESET_EXPIRATION_MIN}
# SMTP
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.auth-code-expiration-min=${MAIL_EXPIRATION_MIN}
spring.mail.properties.mail.debug=${MAIL_DEBUG}
# REDIS
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
# 네이버 OAuth
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:naver}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:secret}
spring.security.oauth2.client.registration.naver.redirect-uri=${NAVER_REDIRECT_URI:localhost}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response
# KAKAO OAuth
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:kakao}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:secret}
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:localhost}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
# GOOGLE OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:secret}
spring.security.oauth2.client.registration.google.scope=profile,email
# GEMINI API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}
# Selenium
selenium.remote-url=${SELENIUM_REMOTE_URL:}
